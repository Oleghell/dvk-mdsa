name: Build MuMu supervised navigation bridge
"on":
  push:
    branches: [feature/mumu-local, feature/mumu-five-profile-test, feature/mumu-limited-five-scenario]
    paths: ['mumu-navigation/**', '.github/workflows/mumu-navigation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - name: Test finite sessions, legacy import, guards and protocol without devices
        env:
          PYTHONPATH: mumu-navigation
        run: python -m unittest discover -s mumu-navigation/tests -v
  android:
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build minimal helper and synthetic no-network fixture
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          bash mumu-navigation/android/build.sh
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          CITY_VERIFY_ONLY=1 bash mumu-navigation/city-android/build.sh
          python3 mumu-navigation/city-android/pack-city-helper.py
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose mumu-navigation/city-android/out/city-helper.apk
          CONTROL_VERIFY_ONLY=1 bash mumu-navigation/control-android/build.sh
          python3 mumu-navigation/control-android/pack-control.py
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose mumu-navigation/control-android/out/control-helper.apk
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose mumu-navigation/control-android/out/keyboard-helper.apk
          FIXTURE_KEYSTORE="$PWD/mumu-navigation/android/out/test-signing.jks" bash mumu-navigation/city-android/build-fixture.sh
          python3 -m pip install Pillow==12.3.0
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify injected navigation on synthetic fixture only
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          pre-emulator-launch-script: python3 mumu-navigation/android/configure-ci-display.py
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash mumu-navigation/android/test-emulator.sh
            bash mumu-navigation/city-android/test-emulator.sh
            python3 mumu-navigation/control-android/test-emulator.py
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-helper-runtime
          path: |
            mumu-navigation/android/out/helper.apk
            mumu-navigation/android/out/helper-manifest.json
            mumu-navigation/city-android/out/city-helper.apk
            mumu-navigation/city-android/out/city-helper-manifest.json
            mumu-navigation/control-android/out/control-helper.apk
            mumu-navigation/control-android/out/keyboard-helper.apk
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: [python, android]
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test guards and authenticated protocol
        shell: powershell
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $env:PYTHONPATH='mumu-navigation'
          python -m unittest discover -s mumu-navigation/tests -v
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/download-artifact@v4
        with:
          name: navigation-helper-runtime
          path: out/helper-artifact/
      - name: Stage all pinned helpers
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force out/MuMu-navigation-windows-x64 | Out-Null
          foreach ($name in @('helper.apk','helper-manifest.json','city-helper.apk','city-helper-manifest.json','control-helper.apk','keyboard-helper.apk')) {
            $files=@(Get-ChildItem out/helper-artifact -Recurse -File -Filter $name)
            if ($files.Count -ne 1) {throw "Missing or ambiguous helper $name"}
            Copy-Item $files[0].FullName "out/MuMu-navigation-windows-x64/$name"
          }
      - name: Build Windows GUI and verify startup
        shell: powershell
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name MuMu-navigation --distpath out/MuMu-navigation-windows-x64 mumu-navigation/mumu_bridge.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $app=Start-Process out/MuMu-navigation-windows-x64/MuMu-navigation.exe -ArgumentList '--self-check' -PassThru
          if (-not $app.WaitForExit(45000)) {$app.Kill();throw 'GUI runtime timed out'}
          if ($app.ExitCode -ne 0) {throw 'GUI runtime failed'}
      - name: Include pinned tunnel and verify package
        shell: powershell
        run: |
          $root='out/MuMu-navigation-windows-x64'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-windows-amd64.exe' -OutFile "$root/cloudflared.exe"
          if ((Get-FileHash "$root/cloudflared.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '86aee4017b26625cee8484c113558f48effa4cd47f7aa05fcf425604e5d2b23c') {throw 'Cloudflare checksum mismatch'}
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/cloudflare/cloudflared/2026.10.0/LICENSE' -OutFile "$root/CLOUDFLARED-LICENSE.txt"
          Copy-Item mumu-navigation/README.md "$root/README.md"
          @{
            bridge_version='1.5.0-control-preview.1'
            universal_control='explicit-local-opt-in-app-scoped-gestures-keys-unicode-ime'
            control_package='com.dvk.control.v1'
            keyboard_package='com.dvk.keyboard.v1'
            city_helper_package='com.dvk.city.v1'
            city_mode='catalog-query-only-no-result-selection-no-filter-application'
            release_stage='development-preview'
            source_commit=$env:GITHUB_SHA
            source_ref=$env:GITHUB_REF
            helper_package='com.dvk.navigation.v132'
            helper_sha256='700d240c6adbf08066f5de2314d447381b4303d6c76aef5bc0a06d722a2c8cd1'
            helper_distribution='pinned-v132-byte-identical-source-and-dex-verified'
            filter_recognition='fixed-anchors-thumb-geometry-colour-cores-on-off-unknown'
            mode='explicit-local-finite-supervised-test'
            real_drugvokrug_tested=$false
          } | ConvertTo-Json | Set-Content "$root/BUILD_INFO.json" -Encoding UTF8
          foreach ($file in @('helper.apk','helper-manifest.json','city-helper.apk','city-helper-manifest.json','control-helper.apk','keyboard-helper.apk','MuMu-navigation.exe','cloudflared.exe')) {if (-not(Test-Path "$root/$file")) {throw "Missing $file"}}
          $hashes=Get-ChildItem $root -File | Sort-Object Name | ForEach-Object {'{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash,$_.Name}
          $hashes | Set-Content "$root/SHA256SUMS.txt" -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: MuMu-navigation-windows-x64
          path: out/MuMu-navigation-windows-x64/
          if-no-files-found: error
          retention-days: 14

  report_results:
    if: ${{ always() }}
    needs: [python, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create result artifact without repository writes
        env:
          MUMU_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYRESULT'
          import json, os
          from pathlib import Path
          Path('ci-result.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'jobs':json.loads(os.environ['MUMU_NEEDS'])},indent=2)+'\n',encoding='utf-8')
          PYRESULT
      - uses: actions/upload-artifact@v4
        with:
          name: mumu-ci-result
          path: ci-result.json
          retention-days: 14
