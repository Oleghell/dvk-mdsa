name: Build MuMu local reader
"on":
  push:
    branches: [feature/mumu-local]
    paths: ['mumu-*.ps1', 'START_MUMU_READ.bat', 'tests/test-mumu.ps1', '.github/workflows/mumu-portable.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Windows and loopback transport
        shell: powershell
        run: |
          ./ci/run-tests.ps1
          ./tests/test-mumu.ps1
      - name: Build core
        shell: powershell
        run: |
          python -m pip install pyinstaller==6.16.0 -r requirements-core.txt
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m PyInstaller --clean --noconfirm --onefile --console --name dvk-chat-core chat_core.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Build complete reader and real Russian OCR runtime
        shell: powershell
        run: ./packaging/build-portable-ocr.ps1
      - name: Set MuMu startup instructions and refresh manifest
        shell: powershell
        run: |
          $root=[IO.Path]::GetFullPath('out/dvk-local-ocr-windows-x64')
          'MuMu: run START_MUMU_READ.bat. Target: 127.0.0.1:5555. No MoreLogin credentials. Keep MuMu and the authorized test chat open, clear the draft and close the Android keyboard. Read-only OCR preview, no clicks or sending. Images are processed in memory. Recognized text is saved locally only after consent. This is NOT a remote access bridge.' | Set-Content (Join-Path $root 'HOW_TO_START.txt') -Encoding UTF8
          $info=Get-Content (Join-Path $root 'BUILD-INFO.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $info | Add-Member -NotePropertyName transport_variant -NotePropertyValue 'mumu_loopback_readonly'
          $info | ConvertTo-Json | Set-Content (Join-Path $root 'BUILD-INFO.json') -Encoding UTF8
          $hashes=Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object {$_.Name -ne 'SHA256SUMS.txt'} | Sort-Object FullName | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash,$_.FullName.Substring($root.Length+1)
          }
          $hashes | Set-Content (Join-Path $root 'SHA256SUMS.txt') -Encoding ASCII
      - name: Verify packaged files
        shell: powershell
        run: |
          $root='out/dvk-local-ocr-windows-x64'
          foreach ($file in @('START_MUMU_READ.bat','mumu-local.ps1','mumu-read.ps1','runtime/chat-core/dvk-chat-core.exe','runtime/tesseract/tesseract.exe')) {
            if (-not (Test-Path (Join-Path $root $file))) {throw ('Missing: '+$file)}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dvk-mumu-windows-x64
          path: out/dvk-local-ocr-windows-x64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
