name: Build one-chat read-only checker 0.3.30
"on":
  push:
    branches: [feature/android-ui-hierarchy]
    paths:
      - 'rootless-unity/one_chat_*.py'
      - 'rootless-unity/diagnose_one_chat.py'
      - 'rootless-unity/smoke_one_chat.py'
      - 'rootless-unity/fixtures/one_chat_fixture.c'
      - 'rootless-unity/tests/test_one_chat.py'
      - 'rootless-unity/ONE-CHAT-0.3.30.md'
      - '.github/workflows/rootless-one-chat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run all rootless unit tests with synthetic data only
        run: python rootless-unity/run_unit_tests.py
      - name: Install pinned ABI test client
        run: python -m pip install frida==17.24.1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Validate synthetic read-only ABI on Linux
        if: runner.os == 'Linux'
        run: |
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/one_chat_fixture.c -o one_chat_fixture.so
          python rootless-unity/smoke_one_chat.py ./one_chat_fixture.so
      - name: Validate synthetic read-only ABI on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/one_chat_fixture.c /Fe:one_chat_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_one_chat.py ./one_chat_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
  windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned packaging dependencies
        run: python -m pip install frida==17.24.1 pyinstaller==6.16.0
      - name: Build separate read-only executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name Dvk-one-chat-check --distpath out/Dvk-one-chat-check-0.3.30-windows-x64 rootless-unity/diagnose_one_chat.py
      - name: Verify packaged GUI starts without ADB or accounts
        shell: powershell
        run: |
          $app=Start-Process -FilePath out/Dvk-one-chat-check-0.3.30-windows-x64/Dvk-one-chat-check.exe -ArgumentList '--self-check' -PassThru
          if (-not $app.WaitForExit(45000)) {$app.Kill(); throw 'GUI self-check timed out'}
          if ($app.ExitCode -ne 0) {throw "GUI self-check failed: $($app.ExitCode)"}
      - name: Package only tool, instructions and checksum manifest
        shell: powershell
        run: |
          $root='out/Dvk-one-chat-check-0.3.30-windows-x64'
          Copy-Item rootless-unity/ONE-CHAT-0.3.30.md "$root/README.md"
          $exe=Get-Item "$root/Dvk-one-chat-check.exe"
          @{source_commit=$env:GITHUB_SHA;read_only=$true;device_scope='test-only';live_android_verified=$false;automatic_replies_available=$false;frida='17.24.1';pyinstaller='6.16.0';sha256=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()} | ConvertTo-Json | Set-Content "$root/build-manifest.json" -Encoding UTF8
          $files=@(Get-ChildItem $root -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (($files -join ',') -ne 'build-manifest.json,Dvk-one-chat-check.exe,README.md') {throw 'Unexpected package files'}
      - uses: actions/upload-artifact@v4
        with:
          name: Dvk-one-chat-check-0.3.30-windows-x64
          path: out/Dvk-one-chat-check-0.3.30-windows-x64/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [test, windows]
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release one-chat readonly 0.3.30') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Dvk-one-chat-check-0.3.30-windows-x64
          path: release/Dvk-one-chat-check-0.3.30-windows-x64
      - name: Publish separate read-only prerelease without private data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          zip -r Dvk-one-chat-check-0.3.30-windows-x64.zip Dvk-one-chat-check-0.3.30-windows-x64
          sha256sum Dvk-one-chat-check-0.3.30-windows-x64.zip > SHA256SUMS.txt
          gh release create rootless-one-chat-v0.3.30 Dvk-one-chat-check-0.3.30-windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "One owned test chat 0.3.30 — read only, no sending" --notes-file ../rootless-unity/ONE-CHAT-0.3.30.md
