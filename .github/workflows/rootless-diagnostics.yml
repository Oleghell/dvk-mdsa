name: Build IL2CPP metadata diagnostics 0.1.3
"on":
  push:
    branches: [feature/android-ui-hierarchy]
    paths: ['rootless-unity/native_metadata.py', 'rootless-unity/smoke_native_metadata.py', 'rootless-unity/fixtures/**', 'rootless-unity/module_evidence.py', 'rootless-unity/diagnose_device.py', 'rootless-unity/test_device.py', 'rootless-unity/smoke_diagnostics.py', 'rootless-unity/tests/**', 'rootless-unity/apk_export.py', 'rootless-unity/DIAGNOSTICS-0.1.3.md', '.github/workflows/rootless-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test device separation, no-replace install and report privacy on synthetic data
        run: python -m unittest discover -s rootless-unity/tests -v
      - name: Run fixed Frida metadata script in owned synthetic child only
        run: |
          python -m pip install frida==17.24.1
          python rootless-unity/smoke_diagnostics.py
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Exercise actual native C ABI bindings on synthetic Linux fixture
        if: runner.os == 'Linux'
        run: |
          cc -shared -fPIC -O2 rootless-unity/fixtures/metadata_fixture.c -o metadata_fixture.so
          python rootless-unity/smoke_native_metadata.py ./metadata_fixture.so
      - name: Exercise actual native C ABI bindings on synthetic Windows fixture
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /O2 /std:c11 rootless-unity/fixtures/metadata_fixture.c /Fe:metadata_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_native_metadata.py ./metadata_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
  windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package metadata diagnostics, never user's APKs or secrets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install pyinstaller==6.16.0 frida==17.24.1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name Dvk-rootless-diagnostics --distpath out/Dvk-rootless-diagnostics-0.1.3-windows-x64 rootless-unity/diagnose_device.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $app=Start-Process -FilePath out/Dvk-rootless-diagnostics-0.1.3-windows-x64/Dvk-rootless-diagnostics.exe -ArgumentList '--self-check' -PassThru
          if (-not $app.WaitForExit(45000)) {$app.Kill();throw 'Packaged GUI self-check timed out'}
          if ($app.ExitCode -ne 0) {throw 'Packaged GUI/Frida self-check failed'}
          $root='out/Dvk-rootless-diagnostics-0.1.3-windows-x64'
          Copy-Item rootless-unity/DIAGNOSTICS-0.1.3.md "$root/README.md"
          $license=python -c "import importlib.metadata; d=importlib.metadata.distribution('frida'); print(d.locate_file(next(p for p in d.files if str(p).endswith('licenses/COPYING'))))"
          if ($LASTEXITCODE -ne 0) {throw 'Frida license lookup failed'}
          Copy-Item -LiteralPath $license -Destination "$root/FRIDA-COPYING.txt"
          @{version='0.1.3';source_commit=$env:GITHUB_SHA;target='127.0.0.1:5563';protected_working_instance='127.0.0.1:5555';frida='17.24.1';root=$false;ocr=$false;mode='native-metadata-only';installation_available=$false;android_runtime_tested=$false;unity_object_access='not-tested'} | ConvertTo-Json | Set-Content "$root/BUILD_INFO.json" -Encoding UTF8
          Get-ChildItem $root -File | Sort-Object Name | ForEach-Object {'{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.Name} | Set-Content "$root/SHA256SUMS.txt" -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: Dvk-rootless-diagnostics-0.1.3-windows-x64
          path: out/Dvk-rootless-diagnostics-0.1.3-windows-x64/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [test, windows]
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release rootless diagnostics 0.1.3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Dvk-rootless-diagnostics-0.1.3-windows-x64
          path: release/Dvk-rootless-diagnostics-0.1.3-windows-x64
      - name: Publish tool only; private test APKs are never uploaded to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          zip -r Dvk-rootless-diagnostics-0.1.3-windows-x64.zip Dvk-rootless-diagnostics-0.1.3-windows-x64
          sha256sum Dvk-rootless-diagnostics-0.1.3-windows-x64.zip > SHA256SUMS.txt
          gh release create rootless-diagnostics-v0.1.3 Dvk-rootless-diagnostics-0.1.3-windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Rootless diagnostics 0.1.3 — existing MuMu number 4 app only" --notes-file ../rootless-unity/DIAGNOSTICS-0.1.3.md
