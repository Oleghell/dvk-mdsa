name: One-time verified contact-read branch cleanup
on:
  push:
    branches: [mumu]
    paths: [.github/workflows/cleanup-contact-read-branch.yml]
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'Oleghell/spam-dvk' && github.ref == 'refs/heads/mumu'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify transferred patch and delete only the unchanged temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/mumu-contact-read-recovery'
          expected='de73a33bac7fda64fc29d8a3639ad1547a394157'
          base='be8b00fca7968bea5b4022ea0d2c33be7325954d'
          transferred='b78e8fdd3090aee2d5c4909f7c6da5f0a1e38820'
          test "$(git rev-parse HEAD^)" = "$transferred"
          actual="$(gh api repos/Oleghell/spam-dvk/git/ref/heads/$branch --jq .object.sha)"
          test "$actual" = "$expected"
          git fetch --no-tags origin "$expected" "$base"
          git diff "$base" "$expected" --binary | git apply --reverse --check
          gh auth setup-git
          git push --force-with-lease="refs/heads/$branch:$expected" origin ":refs/heads/$branch"
