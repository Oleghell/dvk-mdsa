name: Build DvkAssistant
'on':
  push:
    branches:
    - mumu
    paths:
    - rootless-unity/**
    - config/**
    - START_ASSISTANT.bat
    - README.md
    - RELEASE_NOTES.md
    - .github/workflows/assistant.yml
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish after all checks
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: rootless-unity/mumu-ci-requirements.txt
    - name: Unit tests without accounts or Android
      run: python rootless-unity/run_unit_tests.py
    - name: Install pinned native test client
      run: python -m pip install frida==17.24.1
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - name: Run every native suite in three isolated processes
      run: python rootless-unity/run_native_tests.py --workers 3
    - name: Upload native failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: native-logs-${{ runner.os }}
        path: native-test-logs/
        retention-days: 3
  package:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: rootless-unity/mumu-ci-requirements.txt
    - name: Install pinned packaging dependencies
      run: python -m pip install frida==17.24.1 pyinstaller==6.16.0
    - uses: actions/cache@v4
      with:
        path: ~/AppData/Local/pyinstaller
        key: pyinstaller-${{ runner.os }}-py313-mumu-${{ hashFiles('rootless-unity/*ci-requirements.txt') }}
    - name: Build shared onedir GUI and independent MuMu worker
      run: python -m PyInstaller --noconfirm --distpath out rootless-unity/mumu.spec
    - name: Copy external configuration beside the executable
      shell: powershell
      run: 'Copy-Item config out/DvkAssistant-windows-x64/config -Recurse

        Copy-Item config/ai-keys.example.txt out/DvkAssistant-windows-x64/config/ai-keys.txt

        '
    - name: Verify the packaged window starts with no device activity
      shell: powershell
      run: '$app=Start-Process out/DvkAssistant-windows-x64/DvkAssistant.exe -ArgumentList ''--self-check'' -PassThru

        if (-not $app.WaitForExit(45000)) {$app.Kill(); throw ''GUI self-check timed out''}

        if ($app.ExitCode -ne 0) {throw ''GUI self-check failed''}

        '
    - name: Verify packaged worker imports without device actions
      shell: powershell
      run: '& out/DvkAssistant-windows-x64/DvkMumuWorker.exe --mumu-worker-self-check

        if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}

        '
    - name: Add editable settings, instructions and source checksum
      shell: powershell
      run: '$root=''out/DvkAssistant-windows-x64''

        Copy-Item rootless-unity/MUMU-MULTI.md "$root/README.md"

        Copy-Item START_ASSISTANT.bat "$root/START_ASSISTANT.bat"

        Copy-Item RELEASE_NOTES.md "$root/RELEASE_NOTES.md"

        python rootless-unity/build_manifest.py $root

        if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}

        '
    - name: Compress release once after manifest and self-check
      shell: powershell
      run: '$version=python -c "import sys;sys.path.insert(0,''rootless-unity'');from mumu_version import VERSION;print(VERSION)"

        $archive="DvkAssistant-$version-windows-x64.zip"

        7z a -tzip -mx=3 -mmt=on "$archive" ./out/DvkAssistant-windows-x64/*

        if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}

        $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()

        "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii

        '
    - uses: actions/upload-artifact@v4
      with:
        name: DvkAssistant-windows-x64
        path: DvkAssistant-*-windows-x64.zip*
        compression-level: 0
        retention-days: 3
        if-no-files-found: error
  release:
    needs:
    - verify
    - package
    if: inputs.publish == true || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: DvkAssistant-windows-x64
        path: release
    - name: Publish the Windows build as a release
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        version=$(python3 -c "import sys;sys.path.insert(0,''rootless-unity'');from mumu_version import VERSION;print(VERSION)")

        archive="DvkAssistant-$version-windows-x64.zip"

        (cd release && sha256sum -c "$archive.sha256")

        gh release create "v$version" "release/$archive" "release/$archive.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
        --title "DvkAssistant $version" --notes-file RELEASE_NOTES.md --latest

        '
concurrency:
  group: assistant.yml-${{ github.ref }}
  cancel-in-progress: true
