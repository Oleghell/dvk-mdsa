name: Build DvkAssistant
"on":
  push:
    branches: [feature/android-ui-hierarchy, fix/dialog-selection-diagnostics]
    paths:
      - 'rootless-unity/**'
      - 'config/**'
      - 'START_ASSISTANT.bat'
      - 'README.md'
      - '.github/workflows/assistant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests without accounts or Android
        run: python rootless-unity/run_unit_tests.py
      - name: Install pinned native test client
        run: python -m pip install frida==17.24.1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Native manual-approval integration on Linux
        if: runner.os == 'Linux'
        run: |
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/automatic_fixture.c -o assistant_fixture.so
          python rootless-unity/smoke_assistant_pass.py ./assistant_fixture.so
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/profile_navigation_fixture.c -o preview_fixture.so
          python rootless-unity/smoke_assistant_preview.py ./preview_fixture.so
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/search_online_fixture.c -o search_online_fixture.so
          python rootless-unity/smoke_search_online.py ./search_online_fixture.so
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/search_city_fixture.c -o search_city_fixture.so
          python rootless-unity/smoke_search_city.py ./search_city_fixture.so
      - name: Native automatic-chain reply adapter on Linux
        if: runner.os == 'Linux'
        run: |
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/one_chat_fixture.c -o one_chat_fixture.so
          python rootless-unity/smoke_one_chat.py ./one_chat_fixture.so
          python rootless-unity/smoke_one_chat_send.py ./one_chat_fixture.so
          python rootless-unity/smoke_one_chat_name.py ./one_chat_fixture.so
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/dialog_navigation_fixture.c -o dialog_fixture.so
          python rootless-unity/smoke_dialog_navigation.py ./dialog_fixture.so
          cc -shared -fPIC -O0 -pthread rootless-unity/fixtures/dialog_browser_fixture.c -o browser_fixture.so
          python rootless-unity/smoke_dialog_browser.py ./browser_fixture.so
      - name: Native manual-approval and online-filter integration on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/automatic_fixture.c /Fe:assistant_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_assistant_pass.py ./assistant_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Native online-only integration on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/search_online_fixture.c /Fe:search_online_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_search_online.py ./search_online_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Native profile-only preview on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/profile_navigation_fixture.c /Fe:preview_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_assistant_preview.py ./preview_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Native configured-city integration on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/search_city_fixture.c /Fe:search_city_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_search_city.py ./search_city_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Native automatic-chain reply adapter on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/one_chat_fixture.c /Fe:one_chat_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_one_chat.py ./one_chat_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_one_chat_send.py ./one_chat_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_one_chat_name.py ./one_chat_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Native dialog-list roundtrip on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/dialog_navigation_fixture.c /Fe:dialog_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_dialog_navigation.py ./dialog_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Native journal-filtered dialog selection on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cl /nologo /LD /Od /std:c11 rootless-unity/fixtures/dialog_browser_fixture.c /Fe:browser_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python rootless-unity/smoke_dialog_browser.py ./browser_fixture.dll
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
  package:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned packaging dependencies
        run: python -m pip install frida==17.24.1 pyinstaller==6.16.0
      - name: Build the single main executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name DvkAssistant --distpath out/DvkAssistant-windows-x64 rootless-unity/assistant_app.py
      - name: Copy external configuration beside the executable
        shell: powershell
        run: Copy-Item config out/DvkAssistant-windows-x64/config -Recurse
      - name: Verify the packaged window starts with no device activity
        shell: powershell
        run: |
          $app=Start-Process out/DvkAssistant-windows-x64/DvkAssistant.exe -ArgumentList '--self-check' -PassThru
          if (-not $app.WaitForExit(45000)) {$app.Kill(); throw 'GUI self-check timed out'}
          if ($app.ExitCode -ne 0) {throw 'GUI self-check failed'}
      - name: Add editable settings, instructions and source checksum
        shell: powershell
        run: |
          $root='out/DvkAssistant-windows-x64'
          Copy-Item rootless-unity/ASSISTANT.md "$root/README.md"
          Copy-Item START_ASSISTANT.bat "$root/START_ASSISTANT.bat"
          @{source_commit=$env:GITHUB_SHA;entry_mode='visible-journal-dialog-read-check';tool_version='0.4.8';read_module_version='0.4.6';unread_only=$true;unread_filter_live_verified=$false;read_only_chat_binding_available=$true;binding_grants_send_authorization=$false;dialog_limit=5;read_only_check=$true;journal_read_only=$true;analysis_in_memory=$true;live_cycle_available=$false;automatic_send=$false;guided_chain_available=$true;guided_chain_live_verified=$false;guided_chain_per_message_confirmation=$true;guided_chain_notification_available=$true;guided_chain_notification_live_verified=$false;chat_content_read_available=$true;chat_content_exported=$false;telegram_used=$false;new_greetings_available=$false;city_cycle_available=$false;dialog_navigation_available=$true;dialog_navigation_live_verified=$true;dialog_traversal_available=$true;dialog_traversal_live_verified=$false;contact_forwarding_library_available=$true;contact_forwarding_enabled=$true;contact_forwarding_live_verified=$false;device_scope='MuMu-4-only';sha256=(Get-FileHash "$root/DvkAssistant.exe" -Algorithm SHA256).Hash.ToLower()} | ConvertTo-Json | Set-Content "$root/build-manifest.json" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: DvkAssistant-windows-x64
          path: out/DvkAssistant-windows-x64/
          if-no-files-found: error
          retention-days: 14
