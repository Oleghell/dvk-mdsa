name: Build guarded MuMu number 4 Gadget test tool
"on":
  push:
    branches: [feature/android-ui-hierarchy]
    paths: ['rootless-unity/test_device.py', 'rootless-unity/smoke_frida_probe.py', 'rootless-unity/tests/**', 'rootless-unity/apk_export.py', 'rootless-unity/TEST-DEVICE.md', '.github/workflows/rootless-test-device.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test device separation, no-replace install and report privacy on synthetic data
        run: python -m unittest discover -s rootless-unity/tests -v
      - name: Run fixed Frida metadata script in owned synthetic child only
        run: |
          python -m pip install frida==17.24.1
          python rootless-unity/smoke_frida_probe.py
  windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package guarded test tool, never user's APKs or secrets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install pyinstaller==6.16.0 frida==17.24.1
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name Dvk-rootless-test --distpath out/Dvk-rootless-test-0.1.0-windows-x64 rootless-unity/test_device.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $app=Start-Process -FilePath out/Dvk-rootless-test-0.1.0-windows-x64/Dvk-rootless-test.exe -ArgumentList '--self-check' -PassThru
          if (-not $app.WaitForExit(45000)) {$app.Kill();throw 'Packaged GUI self-check timed out'}
          if ($app.ExitCode -ne 0) {throw 'Packaged GUI/Frida self-check failed'}
          $root='out/Dvk-rootless-test-0.1.0-windows-x64'
          Copy-Item rootless-unity/TEST-DEVICE.md "$root/README.md"
          $license=python -c "import importlib.metadata; d=importlib.metadata.distribution('frida'); print(d.locate_file(next(p for p in d.files if str(p).endswith('licenses/COPYING'))))"
          if ($LASTEXITCODE -ne 0) {throw 'Frida license lookup failed'}
          Copy-Item -LiteralPath $license -Destination "$root/FRIDA-COPYING.txt"
          @{version='0.1.0';source_commit=$env:GITHUB_SHA;target='127.0.0.1:5563';protected_working_instance='127.0.0.1:5555';frida='17.24.1';root=$false;ocr=$false;no_replace_install=$true;android_runtime_tested=$false;unity_object_access='not-tested'} | ConvertTo-Json | Set-Content "$root/BUILD_INFO.json" -Encoding UTF8
          Get-ChildItem $root -File | Sort-Object Name | ForEach-Object {'{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.Name} | Set-Content "$root/SHA256SUMS.txt" -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: Dvk-rootless-test-0.1.0-windows-x64
          path: out/Dvk-rootless-test-0.1.0-windows-x64/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [test, windows]
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release rootless test tool 0.1.0') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Dvk-rootless-test-0.1.0-windows-x64
          path: release/Dvk-rootless-test-0.1.0-windows-x64
      - name: Publish tool only; private test APKs are never uploaded to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          zip -r Dvk-rootless-test-0.1.0-windows-x64.zip Dvk-rootless-test-0.1.0-windows-x64
          sha256sum Dvk-rootless-test-0.1.0-windows-x64.zip > SHA256SUMS.txt
          gh release create rootless-test-tool-v0.1.0 Dvk-rootless-test-0.1.0-windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Rootless test tool 0.1.0 — MuMu number 4 only" --notes-file ../rootless-unity/TEST-DEVICE.md
