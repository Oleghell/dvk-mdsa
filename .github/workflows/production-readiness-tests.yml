name: Production-readiness unit tests

on:
  push:
    branches:
      - "feature/mumu-limited-five-scenario"
      - "codex/production-readiness"
  pull_request:
    branches:
      - "feature/mumu-limited-five-scenario"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-tests:
    name: ADB diagnostics (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run diagnostics unit tests
        working-directory: mumu-navigation
        run: python -m unittest discover -s tests -p "test_production_readiness.py" -v
