name: Inspect MuMu build status without browser
"on":
  push:
    branches: [feature/mumu-limited-five-scenario]
    paths: ['.ci/mumu-inspect-request.json']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            if (`${repo.owner}/${repo.repo}` !== 'Oleghell/spam-dvk') throw new Error('Unexpected repository');
            const branch = context.ref.replace(/^refs\/heads\//, '');
            if (branch !== 'feature/mumu-limited-five-scenario') throw new Error('Unexpected branch');
            const input = await github.rest.repos.getContent({...repo, path: '.ci/mumu-inspect-request.json', ref: context.sha});
            const request = JSON.parse(Buffer.from(input.data.content, 'base64').toString('utf8'));
            if (!Number.isSafeInteger(request.run_id) || request.run_id <= 0 || typeof request.nonce !== 'string' || request.nonce.length > 100) throw new Error('Invalid build request');
            const run = (await github.rest.actions.getWorkflowRun({...repo, run_id: request.run_id})).data;
            if (run.head_branch !== branch || run.path.split('@')[0] !== '.github/workflows/mumu-navigation.yml') throw new Error('Unapproved workflow');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id: request.run_id, per_page: 100});
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id: request.run_id, per_page: 100});
            const report = {
              schema: 1, request_nonce: request.nonce, query_run_id: context.runId,
              run_id: run.id, run_url: run.html_url, source_sha: run.head_sha,
              status: run.status, conclusion: run.conclusion, checked_at: new Date().toISOString(),
              jobs: jobs.map(j => ({name: j.name, status: j.status, conclusion: j.conclusion,
                steps: (j.steps || []).map(s => ({name: s.name, status: s.status, conclusion: s.conclusion}))})),
              artifacts: artifacts.map(a => ({id: a.id, name: a.name, size_in_bytes: a.size_in_bytes, expired: a.expired})),
              notice: 'Metadata only. No user PAT, credentials, raw logs, or artifact contents are copied.'
            };
            const path = '.ci/mumu-inspect-result.json';
            let sha;
            try { sha = (await github.rest.repos.getContent({...repo, path, ref: branch})).data.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({...repo, branch, path, ...(sha ? {sha} : {}),
              message: `ci: inspect MuMu run ${run.id}`,
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64')});
            core.info('MuMu build metadata published without browser authentication.');
