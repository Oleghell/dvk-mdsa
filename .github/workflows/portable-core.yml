name: Portable chat core Linux and Windows
"on":
  push:
    branches: [main]
    paths: ['chat_core.py', 'bubble_detector.py', 'requirements-core.txt', 'tests/**', 'examples/**', '.github/workflows/portable-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image dependency
        run: python -m pip install -r requirements-core.txt
      - name: Test common source with synthetic data only
        run: python -m unittest discover -s tests -p "test_*.py" -v
  windows-executable:
    needs: core-tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package same common source, no translation
        run: |
          python -m pip install pyinstaller==6.16.0 -r requirements-core.txt
          python -m PyInstaller --clean --noconfirm --onefile --console --name dvk-chat-core chat_core.py
      - name: Execute actual standalone Windows program
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'core-result.json'
          & ./dist/dvk-chat-core.exe --input ./examples/synthetic-chat.json --output $output
          if ($LASTEXITCODE -ne 0) {throw 'Packaged program failed'}
          $result=Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.message_candidates.Count -ne 2) {throw 'Packaged grouping mismatch'}
          $fixture=Get-Content ./examples/synthetic-chat.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $expected=$fixture.lines[0].text+' '+$fixture.lines[1].text
          if ($result.message_candidates[0].text -ne $expected) {throw 'Packaged Unicode/multiline mismatch'}
          if ($result.automatic_reply_enabled -or $result.messages_sent -ne 0) {throw 'Unexpected action capability'}
          Write-Host 'Standalone Windows executable passed synthetic Unicode and grouping checks.'
      - name: Execute image detection inside the packaged EXE
        run: python tests/check_frozen_image.py dist/dvk-chat-core.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dvk-chat-core-windows-x64
          path: dist/dvk-chat-core.exe
          if-no-files-found: error
          retention-days: 14
