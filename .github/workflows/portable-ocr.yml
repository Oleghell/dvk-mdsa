name: Build portable local OCR
"on":
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'portable-ocr.ps1'
      - 'chat-ocr.ps1'
      - 'chat-core.ps1'
      - 'chat_core.py'
      - 'bubble_detector.py'
      - 'requirements-core.txt'
      - 'tests/test_memory_pipeline.py'
      - 'tests/test-delivered-archive.ps1'
      - '.github/workflows/portable-ocr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test and package integrated common core
        shell: powershell
        run: |
          python -m pip install pyinstaller==6.16.0 -r requirements-core.txt
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m PyInstaller --clean --noconfirm --onefile --console --name dvk-chat-core chat_core.py
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Build and test local OCR runtime on CI only
        shell: powershell
        run: ./packaging/build-portable-ocr.ps1
      - name: Upload complete project with tested runtime
        uses: actions/upload-artifact@v4
        with:
          name: dvk-local-ocr-windows-x64
          path: out/dvk-local-ocr-windows-x64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
